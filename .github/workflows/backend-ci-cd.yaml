name: Backend CI/CD

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
  schedule:
    - cron: '0 11 * * *'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}-backend
  JAVA_VERSION: 17

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend_changed: ${{ github.event_name != 'push' && github.event_name != 'pull_request' || steps.filter.outputs.backend_changed == 'true' }}
    steps:
    # Checkout the code
    # https://github.com/actions/checkout
    - uses: actions/checkout@v7
    
    # Use dorny/paths-filter to check if backend files have changed
    # https://github.com/dorny/paths-filter
    - uses: dorny/paths-filter@v4.0.3
      id: filter
      with:
        filters: |
          backend_changed: ["backend/**"]
  
  test-build-and-scan:
    name: Test and build with Maven + Security scan (backend)
    needs: changes
    runs-on: ubuntu-latest
    if: needs.changes.outputs.backend_changed == 'true'

    permissions:
      contents: read
      security-events: write
      actions: read

    defaults:
      run:
        working-directory: ./backend

    steps:
      # Checkout the code
      # https://github.com/actions/checkout
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Set up Java JDK for Maven build
      # https://github.com/actions/setup-java
      - name: Set up JDK
        uses: actions/setup-java@v5.7.0
        with:
          java-version: '${{ env.JAVA_VERSION }}'
          distribution: 'temurin'
          cache: maven

      # CodeQL initialization
      # https://github.com/github/codeql-action
      - name: CodeQL init
        uses: github/codeql-action/init@v4
        with:
          languages: java

      - name: Verify and build with Maven
        run: mvn -B verify

      # CodeQL analyze
      # https://github.com/github/codeql-action
      - name: CodeQL analyze
        uses: github/codeql-action/analyze@v4

      # Cache Trivy DB for faster scans
      # https://github.com/actions/cache
      - name: Cache Trivy DB
        uses: actions/cache@v6.1.0
        with:
          path: ~/.cache/trivy
          key: trivy-db-${{ github.run_id }}
          restore-keys: trivy-db-

      # Scan for dependency vulnerabilities using Trivy
      # https://github.com/aquasecurity/trivy-action
      - name: Dependency vulnerability scan
        id: fs_scan
        continue-on-error: true
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: ./backend
          format: sarif
          output: backend/trivy-fs-results.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: 1
          trivyignores: ./backend/.trivyignore

      # Upload dependency scan to Security tab
      # https://github.com/github/codeql-action
      - name: Upload dependency scan to Security tab
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: backend/trivy-fs-results.sarif
          category: trivy-dependencies-backend

      # Scan Docker image for vulnerabilities
      # Set up BuildKit Docker container builder to be able to build
      # multi-platform images and export cache
      # https://github.com/docker/setup-buildx-action
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.3.0

      # Extract metadata (tags, labels) for Docker
      # https://github.com/docker/metadata-action
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,format=long
            type=raw,value={{date 'YYYYMMDD-HHmmss'}}

      # Build Docker image with Buildx
      # Build once, load locally only; nothing reaches the registry yet
      # https://github.com/docker/build-push-action
      - name: Build image (local only)
        uses: docker/build-push-action@v7.3.0
        with:
          context: ./backend
          load: true
          push: false
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Scan image for vulnerabilities
      # https://github.com/aquasecurity/trivy-action
      - name: Scan image for vulnerabilities
        id: image_scan
        continue-on-error: true
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          format: sarif
          output: backend/trivy-image-results.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: 1
          trivyignores: ./backend/.trivyignore

      # Upload image scan to Security tab
      # https://github.com/github/codeql-action
      - name: Upload image scan to Security tab
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: backend/trivy-image-results.sarif
          category: trivy-image-backend

      - name: Fail if any security scan found vulnerabilities
        if: steps.fs_scan.outcome == 'failure' || steps.image_scan.outcome == 'failure'
        run: |
          echo "::error::Security vulnerabilities found. See repo Security tab for details."
          exit 1

  publish-docker-image:
    name: Publish Docker image into GHCR (backend)
    needs: test-build-and-scan
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install cosign
        uses: sigstore/cosign-installer@v4.1.2
        with:
          cosign-release: 'v2.2.4'

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.3.0

      - name: Log into registry ${{ env.REGISTRY }}
        uses: docker/login-action@v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,format=long
            type=raw,value={{date 'YYYYMMDD-HHmmss'}}

      - name: Push Docker image to registry
        id: build-and-push
        uses: docker/build-push-action@v7.3.0
        with:
          context: ./backend
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Sign the published Docker image
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          DIGEST: ${{ steps.build-and-push.outputs.digest }}
        run: echo "${TAGS}" | xargs -I {} cosign sign --yes {}@${DIGEST}