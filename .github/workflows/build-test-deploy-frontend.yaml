name: Build, test and deploy frontend

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish Docker image into GHCR (frontend)'
        required: false
        default: false
        type: boolean
  schedule:
    - cron: '0 11 * * *'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

env:
  # Use docker.io for Docker Hub if empty
  REGISTRY: ghcr.io
  # github.repository as <account>/<repo>
  IMAGE_NAME: ${{ github.repository }}-frontend
  PNPM_VERSION: 11.15.1
  NODE_VERSION: 24

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      frontend_changed: ${{ github.event_name != 'push' && github.event_name != 'pull_request' || steps.filter.outputs.frontend_changed == 'true' }}
    steps:
    # Checkout the code
    # https://github.com/actions/checkout
    - uses: actions/checkout@v7

    # Use dorny/paths-filter to check if frontend files have changed
    # https://github.com/dorny/paths-filter
    - uses: dorny/paths-filter@v4.0.3
      id: filter
      with:
        filters: |
          frontend_changed: ["frontend/**"]
  
  lint-build-and-scan:
    name: Lint, type-check, build + Security scan (frontend)
    needs: changes
    runs-on: ubuntu-latest
    if: needs.changes.outputs.frontend_changed == 'true'

    permissions:
      contents: read
      security-events: write
      actions: read

    defaults:
      run:
        working-directory: ./frontend

    steps:
      # Checkout the code
      # https://github.com/actions/checkout
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Configure pnpm
      # https://github.com/pnpm/setup
      - name: Configure pnpm
        uses: pnpm/setup@v2
        with:
          version: ${{ env.PNPM_VERSION }}

      # Set up Node.js
      # https://github.com/actions/setup-node
      - name: Configure Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: '${{ env.NODE_VERSION }}'
          cache: 'pnpm'
          cache-dependency-path: ./frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      
      - name: Run ESLint
        run: pnpm run lint

      - name: Type check (TypeScript)
        run: pnpm exec tsc --noEmit

      - name: Verify production build
        run: pnpm run build

      - name: Audit dependencies (npm audit)
        run: pnpm audit --audit-level=high

      # CodeQL initialization
      # https://github.com/github/codeql-action
      - name: CodeQL init
        uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript

      # CodeQL analyze
      # https://github.com/github/codeql-action
      - name: CodeQL analyze
        uses: github/codeql-action/analyze@v4

  publish-docker-image:
    needs: lint-build-and-scan
    name: Publish Docker image into GHCR (frontend)
    runs-on: ubuntu-latest
    if: github.event_name == 'push'  || (github.event_name == 'workflow_dispatch' && inputs.publish)

    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}-publish
      cancel-in-progress: false

    permissions:
      contents: read
      packages: write
      # This is used to complete the identity challenge
      # with sigstore/fulcio when running outside of PRs.
      id-token: write

    steps:
      # Checkout the code
      # https://github.com/actions/checkout
      - name: Checkout repository
        uses: actions/checkout@v7

      # Install the cosign tool
      # https://github.com/sigstore/cosign-installer
      - name: Install cosign
        uses: sigstore/cosign-installer@v4.1.2
        with:
          cosign-release: 'v2.2.4'

      # Set up BuildKit Docker container builder to be able to build
      # multi-platform images and export cache
      # https://github.com/docker/setup-buildx-action
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.3.0

      # Login against a Docker registry
      # https://github.com/docker/login-action
      - name: Log into registry ${{ env.REGISTRY }}
        uses: docker/login-action@v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Extract metadata (tags, labels) for Docker
      # https://github.com/docker/metadata-action
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=raw,value={{date 'YYYYMMDD-HHmmss'}}

      # Build Docker image with Buildx
      # Build once, load locally only, nothing reaches the registry yet
      # https://github.com/docker/build-push-action
      - name: Build image (local only)
        id: build
        uses: docker/build-push-action@v7.3.0
        with:
          context: ./frontend
          load: true
          push: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Scan image for vulnerabilities
      # https://github.com/aquasecurity/trivy-action
      - name: Scan image for vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          severity: CRITICAL,HIGH
          exit-code: 1

      # Only reached if the scan above passed, push reuses the gha cache
      # so this is essentially free, no rebuild happens
      - name: Push Docker image to registry
        id: build-and-push
        uses: docker/build-push-action@v7.3.0
        with:
          context: ./frontend
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Sign the resulting Docker image digest except on PRs.
      # This will only write to the public Rekor transparency log when the Docker
      # repository is public to avoid leaking data.  If you would like to publish
      # transparency data even for private images, pass --force to cosign below.
      # https://github.com/sigstore/cosign
      - name: Sign the published Docker image
        env:
          # https://docs.github.com/en/actions/security-guides/security-hardening-for-github-actions#using-an-intermediate-environment-variable
          TAGS: ${{ steps.meta.outputs.tags }}
          DIGEST: ${{ steps.build-and-push.outputs.digest }}
        # This step uses the identity token to provision an ephemeral certificate
        # against the sigstore community Fulcio instance.
        run: echo "${TAGS}" | xargs -I {} cosign sign --yes {}@${DIGEST}
